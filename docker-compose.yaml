version: "3.8"

services:
  openviking:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${OPENVIKING_SERVER_PORT:-1933}:${OPENVIKING_SERVER_PORT:-1933}"

    volumes:
      - openviking_data:/app/.openviking

    environment:
      OPENVIKING_PUBLIC_BASE_URL: "${OPENVIKING_PUBLIC_BASE_URL:-}"
      OPENVIKING_SERVER_PORT: "${OPENVIKING_SERVER_PORT:-1933}"

    healthcheck:
      test:
        - CMD
        - openviking-entrypoint
        - "--healthcheck"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

volumes:
  openviking_data: